{% extends 'base.html' %}
{% block title %}Upload File{% endblock %}
{% block content %}
<section class="panel">
    <h1>Upload a CSV</h1>
    <p class="muted">The file needs two columns with headers <code>word</code> and <code>meaning</code>.</p>
    <form method="POST" enctype="multipart/form-data" class="form">
        {{ form.hidden_tag() }}
        <label class="file-drop">
            {{ form.file(accept='.csv') }}
            <span>Choose a .csv file</span>
        </label>
        {{ form.submit(class_='btn btn-primary') }}
    </form>
</section>
{% endblock %}

{% block scripts %}
<script>
    const input = document.querySelector('.file-drop input');
    input.addEventListener('change', () => {
        input.nextElementSibling.textContent = input.files[0] ? input.files[0].name : 'Choose a .csv file';
    });
</script>
{% endblock %}
