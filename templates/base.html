<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vocabulary{% endblock %} · Vocabulary Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">Vocabulary<span>Planner</span></a>
        <nav>
            <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Words</a>
            <a href="{{ url_for('revise') }}" class="{{ 'active' if request.endpoint == 'revise' }}">Revise</a>
            <a href="{{ url_for('add_word') }}" class="{{ 'active' if request.endpoint == 'add_word' }}">Add</a>
            <a href="{{ url_for('upload_file') }}" class="{{ 'active' if request.endpoint == 'upload_file' }}">Upload</a>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
