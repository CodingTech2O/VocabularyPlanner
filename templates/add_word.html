<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Word</title>
</head>
<body>
    <h1>Add New Word</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        <p>
            {{ form.word.label }}<br>
            {{ form.word(size=20) }}
        </p>
        <p>
            {{ form.meaning.label }}<br>
            {{ form.meaning(size=20) }}
        </p>
        <p>{{ form.submit() }}</p>
    </form>
</body>
</html>
